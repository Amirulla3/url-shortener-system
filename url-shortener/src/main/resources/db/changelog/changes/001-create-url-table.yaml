databaseChangeLog:
  - changeSet:
      id: 001-create-url-table
      author: amir

      changes:
        - createTable:
            tableName: links

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: original_url
                  type: TEXT

                  constraints:
                    nullable: false

              - column:
                  name: short_code
                  type: VARCHAR(10)

                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: clicks
                  type: BIGINT
                  defaultValue: 0

                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

                  constraints:
                    nullable: true


