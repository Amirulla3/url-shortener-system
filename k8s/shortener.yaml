apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shortener-service

  template:
    metadata:
      labels:
        app: shortener-service

    spec:
      containers:
        - name: shortener-service
          image: url-shortener-shorter-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: shortener-config

            - secretRef:
                name: postgres-secret

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service

metadata:
  name: shortener-service

spec:
  selector:
    app: shortener-service

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

  type: NodePort